<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pio Pio ❤️</title>

<style>
body{
margin:0;
background:black;
color:white;
font-family:'Segoe UI',sans-serif;
overflow:hidden;
}

#intro{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:100%;
height:100%;
background:black;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
z-index:10;
cursor:pointer;
}

#intro h1{
font-size:22px;
animation:latido 2s infinite;
}

@keyframes latido{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

#video{
display:none;
text-align:center;
padding:40px 20px;
animation:fadein 2s ease forwards;
}

@keyframes fadein{
from{opacity:0;}
to{opacity:1;}
}

.frase{
opacity:0;
margin:30px 0;
font-size:20px;
animation:aparecer 3s ease forwards;
}

@keyframes aparecer{
0%{opacity:0;transform:translateY(20px);}
100%{opacity:1;transform:translateY(0);}
}

img{
width:80%;
max-width:300px;
border-radius:20px;
margin-top:20px;
opacity:0;
animation:foto 4s ease forwards;
}

@keyframes foto{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}

#contador{
margin-top:40px;
font-size:18px;
opacity:0.8;
}

.pollito{
position:fixed;
font-size:24px;
animation:flotar 10s linear infinite;
}

@keyframes flotar{
0%{transform:translateY(100vh);}
100%{transform:translateY(-100vh);}
}
</style>
</head>

<body>

<div id="intro" onclick="iniciar()">
<h1>Toca la pantalla... 🖤<br>Hay algo especial para ti, Pio Pio 🐥</h1>
</div>

<div id="video">

<div class="frase" style="animation-delay:1s;">HOMBRE TRABAJADOR</div>
<div class="frase" style="animation-delay:6s;">INTELIGENTE</div>
<div class="frase" style="animation-delay:11s;">OBRA DE ARTE</div>
<div class="frase" style="animation-delay:16s;">ÚNICO</div>
<div class="frase" style="animation-delay:21s;">INIGUALABLE</div>
<div class="frase" style="animation-delay:26s;">simplemente eres perfecto</div>

<img src="nota.jpg" style="animation-delay:31s;">
<img src="pio.jpg" style="animation-delay:45s;">
<img src="pio2.jpg" style="animation-delay:60s;">
<img src="pio3.jpg" style="animation-delay:75s;">
<img src="pio4.jpg" style="animation-delay:90s;">

<div class="frase" style="animation-delay:105s;">
Te amo… más de lo que las palabras pueden explicar ❤️🐥
</div>

<div id="contador"></div>

</div>

<audio id="musica" loop>
<source src="TU_MP3_AQUI.mp3" type="audio/mpeg">
</audio>

<script>
function iniciar(){
document.getElementById("intro").style.display="none";
document.getElementById("video").style.display="block";
document.getElementById("musica").play();
}

let fechaInicio = new Date("2026-01-06"); // CAMBIA ESTA FECHA
let hoy = new Date();
let dias = Math.floor((hoy - fechaInicio) / (1000 * 60 * 60 * 24));

document.getElementById("contador").innerHTML =
"Llevamos " + dias + " días juntos 🖤";

function crearPollito(){
let pollito = document.createElement("div");
pollito.className = "pollito";
pollito.innerHTML = "🐥";
pollito.style.left = Math.random()*100 + "vw";
pollito.style.animationDuration = (5+Math.random()*5)+"s";
document.body.appendChild(pollito);
setTimeout(()=>{pollito.remove();},10000);
}

setInterval(crearPollito,2000);
</script>

</body>
</html>
