<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pio Pio ❤️</title>

<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

#intro{
position:fixed;
top:0;left:0;
width:100%;
height:100vh;
background:black;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

#contenido{
display:none;
padding:40px;
}

img{
width:80%;
max-width:300px;
border-radius:20px;
margin:10px;
}

#final{
margin-top:40px;
font-size:20px;
}
</style>
</head>

<body>

<div id="intro" onclick="iniciar()">
<h1>Toca para entrar ❤️🐥</h1>
</div>

<div id="contenido">

<h2>Pio Pio ❤️🐥</h2>

<img src="nota.jpg">
<img src="pio.jpg">
<img src="pio2.jpg">
<img src="pio3.jpg">
<img src="pio4.jpg">

<p>simplemente eres perfecto</p>

<div id="final">
Fin.<br>
Gracias por ser parte de esto.
</div>

<audio id="musica" loop>
<source src="https://www.youtube.com/embed/L4RPMSW0Gvc" type="audio/mp3">
</audio>

</div>

<script>
function iniciar(){
document.getElementById("intro").style.display="none";
document.getElementById("contenido").style.display="block";

let audio = document.getElementById("musica");
audio.play().catch(()=>{});
}
</script>

</body>
</html>
